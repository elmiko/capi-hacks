---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-up
  labels:
    app: scale-up
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scale-up
  template:
    metadata:
      labels:
        app: scale-up
    spec:
      nodeSelector:
        node.cluster.x-k8s.io: workload-target
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: "kubernetes.io/hostname"
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - scale-up
      containers:
        - name: busybox
          image: quay.io/elmiko/busybox
          resources:
            requests:
              memory: 50M
              cpu: 50m
          command:
            - /bin/sh
            - "-c"
            - "echo 'this should be in the logs' && sleep 86400"
      terminationGracePeriodSeconds: 0
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scale-up-pdb
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: scale-up
