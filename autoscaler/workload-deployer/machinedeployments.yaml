    capacity.cluster-autoscaler.kubernetes.io/maxPods: "100"
    capacity.cluster-autoscaler.kubernetes.io/memory: "4G"
    capacity.cluster-autoscaler.kubernetes.io/cpu: "4"
    capacity.cluster-autoscaler.kubernetes.io/labels: kubernetes.io/arch=amd64,karpenter.sh/capacity-type=reserved,node.kubernetes.io/instance-type=kubemark-medium
  name: kubemark-md-medium
  namespace: default
spec:
  clusterName: kubemark-workload
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: kubemark-workload
      cluster.x-k8s.io/deployment-name: kubemark-md-medium
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: kubemark-workload
        cluster.x-k8s.io/deployment-name: kubemark-md-medium
        node.cluster.x-k8s.io: medium
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: kubemark-scale-test
      clusterName: kubemark-workload
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha4
        kind: KubemarkMachineTemplate
        name: kubemark-medium
      version: 1.31.2
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  annotations:
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "25"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "1"
    capacity.cluster-autoscaler.kubernetes.io/maxPods: "100"
    capacity.cluster-autoscaler.kubernetes.io/memory: "2G"
    capacity.cluster-autoscaler.kubernetes.io/cpu: "2"
    capacity.cluster-autoscaler.kubernetes.io/labels: kubernetes.io/arch=amd64,karpenter.sh/capacity-type=reserved,node.kubernetes.io/instance-type=kubemark-small
  name: kubemark-md-small
  namespace: default
spec:
  clusterName: kubemark-workload
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: kubemark-workload
      cluster.x-k8s.io/deployment-name: kubemark-md-small
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: kubemark-workload
        cluster.x-k8s.io/deployment-name: kubemark-md-small
        node.cluster.x-k8s.io: small
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: kubemark-scale-test
      clusterName: kubemark-workload
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha4
        kind: KubemarkMachineTemplate
        name: kubemark-small
      version: 1.31.2
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha4
kind: KubemarkMachineTemplate
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: kubemark-workload
  name: kubemark-large
  namespace: default
spec:
  template:
    spec:
      extraMounts:
        - name: containerd-sock
          containerPath: /run/containerd/containerd.sock
          hostPath: /run/containerd/containerd.sock
          type: Socket
      kubemarkOptions:
        extendedResources:
          cpu: 6
          memory: 6G
        registerWithTaints:
          - key: karpenter.sh/unregistered
            effect: NoExecute
        nodeLabels:
          karpenter.sh/capacity-type: reserved
          node.kubernetes.io/instance-type: kubemark-large
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha4
kind: KubemarkMachineTemplate
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: kubemark-workload
  name: kubemark-medium
  namespace: default
spec:
  template:
    spec:
      extraMounts:
        - name: containerd-sock
          containerPath: /run/containerd/containerd.sock
          hostPath: /run/containerd/containerd.sock
          type: Socket
      kubemarkOptions:
        extendedResources:
          cpu: 4
          memory: 4G
        registerWithTaints:
          - key: karpenter.sh/unregistered
            effect: NoExecute
        nodeLabels:
          karpenter.sh/capacity-type: reserved
          node.kubernetes.io/instance-type: kubemark-medium
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha4
kind: KubemarkMachineTemplate
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: kubemark-workload
  name: kubemark-small
  namespace: default
spec:
  template:
    spec:
      extraMounts:
        - name: containerd-sock
          containerPath: /run/containerd/containerd.sock
          hostPath: /run/containerd/containerd.sock
          type: Socket
      kubemarkOptions:
        extendedResources:
          cpu: 2
          memory: 2G
        registerWithTaints:
          - key: karpenter.sh/unregistered
            effect: NoExecute
        nodeLabels:
          karpenter.sh/capacity-type: reserved
          node.kubernetes.io/instance-type: kubemark-small
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: kubemark-scale-test
  namespace: default
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          name: '{{ ds.meta_data.local_hostname }}'

