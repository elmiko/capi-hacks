---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  annotations:
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "25"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "1"
    capacity.cluster-autoscaler.kubernetes.io/maxPods: "100"
    capacity.cluster-autoscaler.kubernetes.io/memory: "6G"
    capacity.cluster-autoscaler.kubernetes.io/cpu: "6"
    capacity.cluster-autoscaler.kubernetes.io/labels: kubernetes.io/arch=amd64,karpenter.sh/capacity-type=reserved,node.kubernetes.io/instance-type=kubemark-large
  name: kubemark-md-large
  namespace: default
spec:
  clusterName: kubemark-workload
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: kubemark-workload
      cluster.x-k8s.io/deployment-name: kubemark-md-large
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: kubemark-workload
        cluster.x-k8s.io/deployment-name: kubemark-md-large
        node.cluster.x-k8s.io: large
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: kubemark-scale-test
      clusterName: kubemark-workload
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha4
        kind: KubemarkMachineTemplate
        name: kubemark-large
      version: 1.31.2
---
