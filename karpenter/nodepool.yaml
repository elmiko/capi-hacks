apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
      nodeClassRef:
        apiVersion: karpenter.cluster.x-k8s.io/v1alpha1
        kind: ClusterAPINodeClass
        name: default
