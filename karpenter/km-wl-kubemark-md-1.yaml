apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  annotations:
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "5"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "1"
    capacity.cluster-autoscaler.kubernetes.io/maxPods: "100"
    capacity.cluster-autoscaler.kubernetes.io/memory: "16G"
    capacity.cluster-autoscaler.kubernetes.io/cpu: "4"
    capacity.cluster-autoscaler.kubernetes.io/labels: kubernetes.io/arch=amd64
  labels:
    cluster.x-k8s.io/cluster-name: km-cp
    node.cluster.x-k8s.io/karpenter-member: ""
  name: km-wl-kubemark-md-1
  namespace: default
spec:
  clusterName: km-cp
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 0
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: km-cp
      cluster.x-k8s.io/deployment-name: km-wl-kubemark-md-1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: km-cp
        cluster.x-k8s.io/deployment-name: km-wl-kubemark-md-1
        node.cluster.x-k8s.io: workload-target
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: km-wl-kubemark-md-1
      clusterName: km-cp
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha4
        kind: KubemarkMachineTemplate
        name: km-wl-kubemark-md-1
      version: v1.31.2
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha4
kind: KubemarkMachineTemplate
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: km-cp
  name: km-wl-kubemark-md-1
  namespace: default
spec:
  template:
    spec:
      extraMounts:
        - name: containerd-sock
          containerPath: /run/containerd/containerd.sock
          hostPath: /run/containerd/containerd.sock
          type: Socket
      kubemarkOptions:
        extendedResources:
          cpu: 4
          memory: 16G
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: km-wl-kubemark-md-1
  namespace: default
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          name: ''
